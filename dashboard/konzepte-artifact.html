<style>
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background:#111}
[hidden]{display:none!important}

/* ---- Umschalter (gehört zur Vorschau, nicht zum Entwurf) ---- */
.switch{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 20px;background:#111;color:#8b8b93;border-bottom:1px solid #2a2a31;
  font:500 12px/1 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase}
.switch button{font:inherit;padding:7px 14px;border-radius:0;border:1px solid #3a3a44;background:transparent;
  color:#c9c9d2;cursor:pointer;letter-spacing:.06em}
.switch button[aria-pressed="true"]{background:#f2f2f5;color:#111;border-color:#f2f2f5}
.switch .note{margin-left:auto;text-transform:none;letter-spacing:0;font-family:"IBM Plex Sans",sans-serif;font-size:12px;color:#6c6c76}
@media (max-width:700px){.switch .note{margin-left:0;width:100%}}

.stage{min-height:100vh}

/* ==========================================================
   A · PROGRAMMHEFT
   ========================================================== */
.a{--paper:#F7F5F0;--ink:#14140F;--ink2:#54524a;--ink3:#8a877c;--rule:#d8d4c8;--gruen:#1F4D3C;
   background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",sans-serif}
.a .wrap{max-width:980px;margin:0 auto;padding:0 24px 80px}
.a .kopf{padding:44px 0 18px;border-bottom:3px double var(--ink)}
.a h1{font-family:"Source Serif 4",Georgia,serif;font-weight:600;font-size:clamp(30px,5vw,46px);
  margin:0;letter-spacing:-.015em;line-height:1.05}
.a .unter{font-family:"Source Serif 4",serif;font-style:italic;color:var(--ink3);margin:6px 0 0;font-size:15px}
.a .stand{float:right;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2);line-height:1.8}
.a .lauf{display:flex;flex-wrap:wrap;gap:0 28px;padding:16px 0;border-bottom:1px solid var(--rule);
  font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink2)}
.a .lauf b{color:var(--gruen);font-weight:600}
.a h2{font-family:"Source Serif 4",serif;font-weight:600;font-size:21px;margin:38px 0 4px;color:var(--gruen)}
.a .h2note{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink3);letter-spacing:.04em;
  text-transform:uppercase;margin-bottom:14px}
.a .treffer{columns:2;column-gap:32px}
@media (max-width:760px){.a .treffer{columns:1}}
.a .tr{break-inside:avoid;border-left:3px solid var(--gruen);padding:2px 0 14px 14px;margin-bottom:18px}
.a .tr .t{font-family:"Source Serif 4",serif;font-weight:600;font-size:19px;line-height:1.2}
.a .tr .m{font-size:13.5px;color:var(--ink2);margin-top:3px}
.a .tr .z{font-family:"IBM Plex Mono",monospace;font-size:13px;margin-top:6px}
.a .tag{margin-top:26px;border-top:1px solid var(--ink);padding-top:10px}
.a .tag .d{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.a .kino{margin-top:14px}
.a .kino .n{font-family:"Source Serif 4",serif;font-weight:600;font-size:16px;border-bottom:1px solid var(--rule);padding-bottom:3px}
.a .z{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 18px;padding:7px 0;border-bottom:1px dotted var(--rule);align-items:baseline}
.a .z:last-child{border-bottom:0}
.a .z .film{font-family:"Source Serif 4",serif;font-size:16px;min-width:0;overflow-wrap:anywhere}
.a .z .film em{font-style:normal;color:var(--gruen);font-weight:600}
.a .z .meta{grid-column:1;font-size:12px;color:var(--ink3)}
.a .z .zeiten{grid-row:1/span 2;font-family:"IBM Plex Mono",monospace;font-size:13.5px;text-align:right;white-space:nowrap}
.a .z .zeiten a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule)}
.a .z .zeiten a:hover{border-color:var(--gruen);color:var(--gruen)}
@media (max-width:560px){.a .z{grid-template-columns:minmax(0,1fr)}.a .z .zeiten{grid-row:auto;text-align:left;margin-top:3px}.a .stand{float:none;text-align:left;margin-bottom:10px}}
.a .fuss{margin-top:40px;padding-top:14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink3);max-width:62ch}

/* ==========================================================
   B · NACHTVORSTELLUNG
   ========================================================== */
.b{--grund:#0E1013;--tief:#15181d;--text:#EDE9E1;--text2:#9aa0a8;--text3:#61666e;--linie:#232830;--licht:#7FD8CC;
   background:var(--grund);color:var(--text);font-family:"Archivo Narrow","IBM Plex Sans",sans-serif}
.b .wrap{max-width:1000px;margin:0 auto;padding:0 20px 80px}
.b .kopf{padding:40px 0 22px}
.b h1{font-weight:700;font-size:clamp(28px,6vw,52px);text-transform:uppercase;letter-spacing:.01em;margin:0;line-height:.98}
.b .unter{color:var(--text3);font-size:14px;margin:8px 0 0;font-family:"IBM Plex Sans",sans-serif}
.b .band{margin-top:30px;border-top:1px solid var(--linie);padding-top:16px}
.b .band>h2{font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:var(--text3);margin:0 0 14px;font-weight:700}
.b .band.jetzt>h2{color:var(--licht)}
.b .zeile{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:14px 0;border-bottom:1px solid var(--linie)}
.b .zeile:last-child{border-bottom:0}
.b .uhr{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;font-size:26px;font-weight:500;min-width:96px;color:var(--text2)}
.b .zeile.hit .uhr{color:var(--licht);text-shadow:0 0 24px rgba(127,216,204,.35)}
.b .titel{font-size:21px;text-transform:uppercase;font-weight:700;letter-spacing:.01em}
.b .zeile.hit .titel{color:#fff}
.b .ort{font-family:"IBM Plex Sans",sans-serif;font-size:13px;color:var(--text3);margin-left:auto;text-align:right}
.b .marke{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;padding:2px 6px;border:1px solid currentColor}
.b .m-w{color:#FF8000}
.b .m-m{color:#fff;background:#001489;border-color:#001489}
.b .leer{padding:26px 0;color:var(--text3);font-family:"IBM Plex Sans",sans-serif;font-size:14px;border-bottom:1px solid var(--linie)}
.b a{color:inherit;text-decoration:none}
.b .fuss{margin-top:40px;padding-top:14px;border-top:1px solid var(--linie);font-family:"IBM Plex Sans",sans-serif;font-size:12.5px;color:var(--text3);max-width:62ch}

/* ==========================================================
   C · KARTEIKARTE
   ========================================================== */
.c{--karton:#EFE7D8;--karte:#F8F3E8;--graph:#2B2B28;--graph2:#5f5d54;--graph3:#8d8a7e;--linie:#d6cdb9;--stempel:#4A2E4D;
   background:var(--karton);color:var(--graph);font-family:"IBM Plex Sans",sans-serif}
.c .wrap{max-width:1060px;margin:0 auto;padding:0 20px 80px}
.c .kopf{padding:40px 0 18px;border-bottom:2px solid var(--graph)}
.c h1{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:clamp(22px,4vw,32px);margin:0;letter-spacing:-.01em}
.c .unter{font-size:13.5px;color:var(--graph3);margin:6px 0 0}
.c .bilanz{display:flex;flex-wrap:wrap;gap:0;margin-top:22px;border:1px solid var(--linie);background:var(--karte)}
.c .bilanz div{flex:1 1 130px;padding:14px 16px;border-right:1px solid var(--linie)}
.c .bilanz div:last-child{border-right:0}
.c .bilanz .n{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:600;display:block;line-height:1}
.c .bilanz .l{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--graph3);margin-top:4px;display:block}
.c .bilanz .laeuft .n{color:var(--stempel)}
.c h2{font-family:"IBM Plex Mono",monospace;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--graph2);margin:34px 0 12px}
.c .karten{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.c .k{background:var(--karte);border:1px solid var(--linie);padding:13px 15px;position:relative;min-height:128px;display:flex;flex-direction:column}
.c .k.aktiv{border-color:var(--stempel);box-shadow:inset 3px 0 0 var(--stempel)}
.c .k .t{font-weight:600;font-size:15.5px;line-height:1.25;padding-right:64px}
.c .k .o{font-size:12.5px;color:var(--graph3);font-style:italic;margin-top:2px}
.c .k .felder{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--graph2);margin-top:9px;line-height:1.75}
.c .k .felder span{color:var(--graph3)}
.c .k .term{margin-top:auto;padding-top:9px;border-top:1px dotted var(--linie);font-family:"IBM Plex Mono",monospace;font-size:12px}
.c .stempel{position:absolute;top:11px;right:12px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.09em;
  text-transform:uppercase;padding:3px 6px;border:1.5px solid var(--graph3);color:var(--graph3);transform:rotate(-4deg)}
.c .stempel.an{border-color:var(--stempel);color:var(--stempel)}
.c .fuss{margin-top:40px;padding-top:14px;border-top:1px solid var(--linie);font-size:12.5px;color:var(--graph3);max-width:62ch}
</style>

<nav class="switch" id="sw">
  <span>Richtung</span>

  <button data-k="b" aria-pressed="false">B · Nachtvorstellung</button>
  <button data-k="c" aria-pressed="false">C · Karteikarte</button>
  <span class="note">Echte Daten vom 18.09.2026 — dieselbe Grundlage wie im Dashboard.</span>
</nav>
<div class="stage" id="stage"></div>

<script>
(function () {
  var d = window.__TODAY__, WL = (window.__WATCHLIST__ || { filme: [] }).filme.map(function (f) {
    return { slug: f[0], name: f[2], original: f[3], jahr: f[4], laufzeit: f[5], regie: f[6] }; });
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]; }); };
  var TAGE = ['So','Mo','Di','Mi','Do','Fr','Sa'];
  var kurz = function (iso) { var x = new Date(iso + 'T12:00:00');
    return String(x.getDate()).padStart(2,'0') + '.' + String(x.getMonth()+1).padStart(2,'0') + '.'; };
  var wtag = function (iso) { return TAGE[new Date(iso + 'T12:00:00').getDay()]; };
  var kino = {}; d.cinemas.forEach(function (c) { kino[c.id] = c; });
  var heute = d.dates[0];
  var grenze = (function () { for (var i = 1; i < d.dates.length; i++)
    if (new Date(d.dates[i] + 'T12:00:00').getDay() === 4) return d.dates[i]; return null; })();

  function alleVorst(filter) {
    var out = [];
    d.films.forEach(function (f) { f.showings.forEach(function (s) {
      if (!filter || filter(s, f)) out.push({ f: f, s: s }); }); });
    return out.sort(function (a, b) {
      return (a.s.date + a.s.time).localeCompare(b.s.date + b.s.time); });
  }
  var istTreffer = function (f) { return f.match.status === 'treffer'; };

  // ---------- A · Programmheft ----------
  function renderA() {
    var h = ['<div class="a"><div class="wrap">'];
    h.push('<header class="kopf"><div class="stand">Stuttgart · ' + d.cinemas.length + ' Kinos<br>' +
      kurz(d.date_from) + '–' + kurz(d.date_to) + '<br>' + d.stats.vorstellungen + ' Vorstellungen</div>' +
      '<h1>Schrödingers Kino</h1><p class="unter">Programm für deine Watchlist · Stuttgart</p></header>');

    h.push('<div class="lauf"><span>Watchlist <b>' + d.watchlist.total + ' Titel</b></span>' +
      '<span>Im Programm <b>' + d.stats.filme + '</b></span>' +
      '<span>Treffer <b>' + d.stats.treffer + '</b></span>' +
      '<span>MUBI GO <b>' + d.stats.mubi_go + '</b></span></div>');

    var tr = d.films.filter(istTreffer);
    h.push('<h2>Deine Treffer</h2><p class="h2note">Filme von der Watchlist im gesamten Zeitraum</p><div class="treffer">');
    tr.forEach(function (f) {
      var orte = [...new Set(f.showings.map(function (s) { return kino[s.cinema_id].name; }))];
      var t0 = f.showings[0], tn = f.showings[f.showings.length - 1];
      h.push('<article class="tr"><div class="t">' + esc(f.title) + '</div>' +
        '<div class="m">' + esc(orte.join(' · ')) + (f.mubi_go ? ' · MUBI GO' : '') + '</div>' +
        '<div class="z">' + (f.showings.length === 1
          ? kurz(t0.date) + ' um ' + t0.time + (t0.version ? ' · ' + t0.version : '')

    });
    h.push('</div>');

    var tage = grenze ? d.dates.filter(function (x) { return x < grenze; }) : d.dates.slice(0, 6);
    h.push('<h2>Das Programm</h2><p class="h2note">Die laufende Spielwoche</p>');
    tage.forEach(function (dt) {
      h.push('<section class="tag"><div class="d">' + wtag(dt) + ', ' + kurz(dt) + '</div>');
      d.cinemas.forEach(function (c) {
        var rows = d.films.map(function (f) {
          return { f: f, s: f.showings.filter(function (s) { return s.date === dt && s.cinema_id === c.id; }) };
        }).filter(function (x) { return x.s.length; });
        if (!rows.length) return;
        h.push('<div class="kino"><div class="n">' + esc(c.name) + '</div>');
        rows.forEach(function (x) {
          var meta = [x.f.genre, x.f.runtime_min ? x.f.runtime_min + ' Min' : null].filter(Boolean).join(' · ');
          h.push('<div class="z"><div class="film">' + (istTreffer(x.f) ? '<em>' + esc(x.f.title) + '</em>' : esc(x.f.title)) +
            (x.f.mubi_go ? ' <span style="font-size:11px;color:#001489">MUBI GO</span>' : '') + '</div>' +
            '<div class="meta">' + esc(meta) + '</div><div class="zeiten">' +
            x.s.map(function (s) { return s.booking_url
              ? '<a href="' + esc(s.booking_url) + '" target="_blank" rel="noopener">' + s.time + '</a>' + (s.version ? ' ' + s.version : '')
              : s.time + (s.version ? ' ' + s.version : ''); }).join('&nbsp; ') + '</div></div>');
        });
        h.push('</div>');
      });
      h.push('</section>');
    });

    if (grenze) {
      var spaet = alleVorst(function (s) { return s.date >= grenze; });
      h.push('<h2>Im Vorverkauf</h2><p class="h2note">Einzeltermine bis ' + kurz(d.date_to) + '</p><section class="tag">');
      spaet.slice(0, 18).forEach(function (x) {
        h.push('<div class="z"><div class="film">' + (istTreffer(x.f) ? '<em>' + esc(x.f.title) + '</em>' : esc(x.f.title)) +
          '</div><div class="meta">' + esc(kino[x.s.cinema_id].name) + '</div>' +
          '<div class="zeiten">' + kurz(x.s.date) + ' · ' + x.s.time + '</div></div>');
      });
      h.push('</section>');
    }
    h.push('<p class="fuss">Kinos, Filme und Zeiten von kino-zeit.de. Vor der Fahrt in die Stadt beim Kino gegenprüfen.</p>');
    return h.join('') + '</div></div>';
  }

  // ---------- B · Nachtvorstellung ----------
  function renderB() {
    var h = ['<div class="b"><div class="wrap">'];
    h.push('<header class="kopf"><h1>Schrödingers Kino</h1>' +
      '<p class="unter">' + wtag(heute) + ', ' + kurz(heute) + ' · Stuttgart · ' +
      d.watchlist.total + ' Titel auf der Watchlist</p></header>');

    function zeile(x, hit) {
      var c = kino[x.s.cinema_id];
      return '<div class="zeile' + (hit ? ' hit' : '') + '">' +
        '<div class="uhr">' + x.s.time + '</div>' +
        '<div class="titel">' + esc(x.f.title) + '</div>' +
        (hit ? '<span class="marke m-w">Watchlist</span>' : '') +
        (x.f.mubi_go ? '<span class="marke m-m">MUBI GO</span>' : '') +
        '<div class="ort">' + esc(c.name) + (x.s.version ? ' · ' + x.s.version : '') + '</div></div>';
    }

    var heuteAlle = alleVorst(function (s) { return s.date === heute; });
    var abend = heuteAlle.filter(function (x) { return x.s.time >= '17:00'; });
    h.push('<section class="band jetzt"><h2>Heute Abend · ab 17 Uhr</h2>');
    abend.forEach(function (x) { h.push(zeile(x, istTreffer(x.f))); });
    h.push('</section>');

    var woche = alleVorst(function (s) { return s.date > heute && (!grenze || s.date < grenze); })
      .filter(function (x) { return istTreffer(x.f); });
    h.push('<section class="band"><h2>Diese Woche · von deiner Watchlist</h2>');
    if (woche.length) woche.forEach(function (x) {
      h.push(zeile(x, true).replace('class="uhr"', 'class="uhr" title="' + x.s.date + '"')
        .replace('>' + x.s.time + '<', '>' + kurz(x.s.date) + ' ' + x.s.time + '<'));
    });
    else h.push('<div class="leer">Diese Woche läuft nichts weiter von deiner Liste.</div>');
    h.push('</section>');

    var vor = grenze ? alleVorst(function (s) { return s.date >= grenze; }).filter(function (x) { return istTreffer(x.f); }) : [];
    h.push('<section class="band"><h2>Im Vorverkauf</h2>');
    if (vor.length) vor.forEach(function (x) {
      h.push('<div class="zeile hit"><div class="uhr" style="font-size:18px">' + kurz(x.s.date) + '</div>' +
        '<div class="titel">' + esc(x.f.title) + '</div><span class="marke m-w">Watchlist</span>' +
        '<div class="ort">' + esc(kino[x.s.cinema_id].name) + ' · ' + x.s.time + '</div></div>');
    });
    else h.push('<div class="leer">Nichts vorgemerkt.</div>');
    h.push('</section>');

    h.push('<section class="band"><h2>Verpasst</h2>' +
      '<div class="leer">Noch leer — das Zeitfenster beginnt heute. Sobald der tägliche Lauf mitschreibt, ' +
      'stehen hier Filme von deiner Liste, deren letzte Vorstellung vorbei ist.</div></section>');

    h.push('<p class="fuss">Kinos, Filme und Zeiten von kino-zeit.de. Kobalt kennzeichnet MUBI GO, Orange die Watchlist.</p>');
    return h.join('') + '</div></div>';
  }

  // ---------- C · Karteikarte ----------
  function renderC() {
    var laufend = {};
    d.films.forEach(function (f) {
      if (f.match.status === 'treffer' && f.match.watchlist) laufend[f.match.watchlist.title] = f;
    });
    var mit = WL.filter(function (w) { return laufend[w.name]; });
    var ohne = WL.filter(function (w) { return !laufend[w.name]; });

    var h = ['<div class="c"><div class="wrap">'];
    h.push('<header class="kopf"><h1>Schrödingers Kino</h1>' +
      '<p class="unter">Kartei der Watchlist · Stand ' + kurz(heute) + ' · Zeitraum bis ' + kurz(d.date_to) + '</p></header>');

    h.push('<div class="bilanz">' +
      '<div class="laeuft"><span class="n">' + mit.length + '</span><span class="l">läuft</span></div>' +
      '<div><span class="n">' + ohne.length + '</span><span class="l">nicht im Programm</span></div>' +
      '<div><span class="n">' + WL.length + '</span><span class="l">Titel gesamt</span></div>' +
      '<div><span class="n">' + WL.filter(function (w) { return w.original; }).length +
        '</span><span class="l">mit Originaltitel</span></div></div>');

    function karte(w, aktiv) {
      var f = laufend[w.name];
      var felder = [];
      if (w.regie) felder.push('<span>Regie</span> ' + esc(w.regie.split(',')[0]));
      if (w.jahr) felder.push('<span>Jahr</span> ' + w.jahr);
      if (w.laufzeit) felder.push('<span>Lauf</span> ' + w.laufzeit + ' Min');
      var term = '';
      if (f) {
        var s0 = f.showings[0];
        term = '<div class="term">' + kurz(s0.date) + ' · ' + s0.time + ' · ' + esc(kino[s0.cinema_id].name) +
          (f.showings.length > 1 ? ' <span style="color:#8d8a7e">+' + (f.showings.length - 1) + '</span>' : '') + '</div>';
      }
      return '<article class="k' + (aktiv ? ' aktiv' : '') + '">' +
        '<span class="stempel' + (aktiv ? ' an' : '') + '">' + (aktiv ? 'läuft' : 'kein Termin') + '</span>' +
        '<div class="t">' + esc(w.name) + '</div>' +
        (w.original ? '<div class="o">' + esc(w.original) + '</div>' : '') +
        '<div class="felder">' + felder.join('<br>') + '</div>' + term + '</article>';
    }

    h.push('<h2>Läuft im Zeitraum</h2><div class="karten">');
    mit.forEach(function (w) { h.push(karte(w, true)); });
    h.push('</div>');

    h.push('<h2>Ohne Termin · ' + ohne.length + ' Titel</h2><div class="karten">');
    ohne.slice(0, 24).forEach(function (w) { h.push(karte(w, false)); });
    h.push('</div>');

    h.push('<p class="fuss">Regie, Originaltitel und Laufzeit stammen aus dem Letterboxd-Endpunkt ' +
      '<code>/film/&lt;slug&gt;/json/</code>. Genau diese drei Felder tragen im Hintergrund den ' +
      'sprachübergreifenden Abgleich — die Kartei zeigt also, woraus sie denkt. ' +

    return h.join('') + '</div></div>';

  var render = { a: renderA, b: renderB, c: renderC };
  function zeige(k) {

    document.querySelectorAll('#sw button').forEach(function (b) {
